name: mix

# PERTURBED-REAL mixing sweep (edsp/data/perturb.py): the edges of real graphs are
# re-wired to controlled homogeneous, heterogeneous, spatially regional, class-
# structured and chaotic mixing; EDSP (default + tuned) vs the Track-A baselines.
# Results are PERTURBED-REAL (rule R4) and are pushed to results/mix-<run_id>
# under results/perturbed/, never into the real-world E1/E2 tables.

on:
  workflow_dispatch:
    inputs:
      bases:
        description: "Space-separated real base graphs"
        default: "cora citeseer amazon-ratings roman-empire wiki-editor"
      specs:
        description: "Space-separated mixing specs (empty = the registered sweep)"
        default: ""
      seeds:
        description: "Re-wiring seeds per condition"
        default: "3"
      max_splits:
        description: "Splits per seed"
        default: "3"
      runner:
        description: "Runner for the experiment jobs: ubuntu-latest (GitHub) or self-hosted (the owner's machine)"
        default: "ubuntu-latest"
      extra_args:
        description: "Extra runner flags, e.g. --fullh (E5)"
        default: ""
      seed_offset:
        description: "First re-wiring seed (A4 confirmatory run: 10)"
        default: "0"
  pull_request:
    paths:
      - "edsp/data/perturb.py"
      - "scripts/aggregate_mix.py"
      - ".github/workflows/mix.yml"

permissions:
  contents: read

env:
  SWEEP: >-
    global:h=0 global:h=0.1 global:h=0.2 global:h=0.3 global:h=0.4 global:h=0.5
    global:h=0.6 global:h=0.7 global:h=0.8 global:h=0.9 global:h=1
    beta:m=0.5,c=0.5 beta:m=0.5,c=5 beta:m=0.2,c=0.5 beta:m=0.8,c=0.5
    uniform logistic
    regional:s=20,hi=0.9,lo=0.1 regional:s=200,hi=0.9,lo=0.1
    community:hi=0.9,lo=0.1
    permutation:h=0.1 permutation:h=0.3

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      extra: ${{ steps.p.outputs.extra }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASES="cora"; SPECS="global:h=0.2 uniform permutation:h=0.1"; EXTRA="--perturb-seeds 1 --max-splits 1"
          else
            BASES="${{ inputs.bases }}"; SPECS="${{ inputs.specs }}"; [ -z "$SPECS" ] && SPECS="$SWEEP"
            EXTRA="--perturb-seeds ${{ inputs.seeds }} --perturb-seed-offset ${{ inputs.seed_offset }} --max-splits ${{ inputs.max_splits }} ${{ inputs.extra_args }}"
          fi
          M=$(python3 -c 'import json,sys; b,s=sys.argv[1].split(),sys.argv[2].split(); print(json.dumps({"include":[{"base":x,"spec":y} for x in b for y in s]}))' "$BASES" "$SPECS")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 15  # leave runners for pull-request CI
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      EDSP_DATA_DIR: ${{ github.workspace }}/.edsp-cache
      EDSP_ACQUISITION_LOG: ${{ github.workspace }}/results/acq/ACQUISITION_LOG.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Install uv from PyPI (GitHub release downloads returned HTTP 504 on 2026-11-08)
        run: |
          for i in 1 2 3 4 5; do python3 -m pip install --user --break-system-packages -q uv==0.13.7 && break; sleep 15; done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --group dev
      - uses: actions/cache@v4
        with:
          path: .edsp-cache
          key: edsp-raw-${{ hashFiles('data/REGISTRY.json') }}
          restore-keys: edsp-raw-
      - id: tag
        run: echo "tag=$(echo '${{ matrix.base }}-${{ matrix.spec }}' | tr -c 'A-Za-z0-9.=_-' '_')" >> "$GITHUB_OUTPUT"
      - run: |
          rm -rf results/perturbed/runs
          uv run python scripts/run_e1.py --suite MIX --out results/perturbed/runs --h7-splits 0 \
            --datasets ${{ matrix.base }} --perturb '${{ matrix.spec }}' ${{ needs.plan.outputs.extra }}
          cp results/acq/ACQUISITION_LOG.jsonl "results/perturbed/runs/ACQUISITION_LOG-${{ steps.tag.outputs.tag }}.jsonl" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mix-${{ steps.tag.outputs.tag }}
          path: results/perturbed/runs/
          if-no-files-found: warn

  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv from PyPI (GitHub release downloads returned HTTP 504 on 2026-11-08)
        run: |
          for i in 1 2 3 4 5; do python3 -m pip install --user --break-system-packages -q uv==0.13.7 && break; sleep 15; done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --group dev
      - run: rm -rf results/perturbed/runs results/perturbed/aggregates
      - uses: actions/download-artifact@v4
        with:
          pattern: mix-*
          path: results/perturbed/runs
          merge-multiple: true
      - run: uv run python scripts/aggregate_mix.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push results branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "results/mix-${{ github.run_id }}"
          git add -f results/perturbed/runs results/perturbed/aggregates
          git commit -m "MIX (PERTURBED-REAL) results from Actions run ${{ github.run_id }} (commit ${{ github.sha }})"
          git push origin "results/mix-${{ github.run_id }}"
