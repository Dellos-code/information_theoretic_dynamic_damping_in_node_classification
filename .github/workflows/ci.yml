name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --frozen --group dev
      - run: EDSP_REQUIRE_TORCH=1 uv run pytest -q tests/unit
      - run: uv run --with ruff ruff check edsp tests
      - run: uv run --with mypy mypy edsp/core.py

  signed-gnn:
    # B5 signed GNNs (PR-29): torch-geometric-signed-directed is optional and not in uv.lock;
    # installed on top of the locked environment (torch stays at the locked version) for
    # the B5 tests only, so the `unit` job above is unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --frozen --group dev
      - run: uv pip install -r requirements/signed-gnn.txt
      - run: EDSP_REQUIRE_PYGSD=1 uv run --no-sync pytest -q tests/unit/test_signed_gnn.py tests/unit/test_run_e1_b56.py
