name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --frozen --group dev
      - run: EDSP_REQUIRE_TORCH=1 uv run pytest -q tests/unit
      - run: uv run --with ruff ruff check edsp tests
      - run: uv run --with mypy mypy edsp/core.py
