name: e1

# Suites E1 / E2 (Master Prompt §7). E1: Track-A EDSP vs B0/B1 Track-A baselines on
# all registered real single-label datasets. E2: the native-polarity graphs — signed
# (H-NATIVE; + signed_vote, signed_lgc) and relation-typed (H-RELATION) — i.e. the
# registry cells C3a and C5. workflow_dispatch runs the chosen suite (one job per
# dataset), aggregates the run records and pushes them, with the aggregate tables,
# to a new branch results/<suite>-<run_id>. On pull requests a 1-split smoke run
# checks the pipeline end to end. Registry entries with an "extension" field (e.g. the
# PR-20 "native-mixed" graphs) are left out of the default lists, so the suites already
# run keep their dataset set; name them in the `datasets` input to run them.
# C4 (H5, PR-27): the native probabilistic multi-label graphs (default: ogbn-proteins) run
# scripts/run_c4.py per task view instead of run_e1.py; `chunks` (name:total:size[:start]) then splits TASKS, e.g.
# "ogbn-proteins:112:4" = one job per 4 tasks (--tasks 0:4, 4:8, ...), and the run records
# are aggregated by scripts/aggregate_c4.py into results/aggregates/c4.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "E1, E2 or C4"
        default: "E1"
      datasets:
        description: "Space-separated dataset names (empty = every dataset of the suite, without registry extensions)"
        default: ""
      runner:
        description: "Runner for the experiment jobs: ubuntu-latest (GitHub) or self-hosted (the owner's machine)"
        default: "ubuntu-latest"
      extra_args:
        description: "Extra runner flags, e.g. --fullh (E5); B5: --gnn-only --signed-gnn sgcn,snea,sdgnn,sigat; B6: --track B --gnn-only --gnn= --fraud-gnn care,pcgnn; E3 post-hoc: --track B --gnn-only --gnn= --posthoc cs2hop,clp,linbp_b"
        default: ""
      chunks:
        description: "Datasets run as one job per split range, as name:n_splits:splits_per_job (C4: name:n_tasks:tasks_per_job)"
        default: "yelpchi:10:1 amazon-fraud:10:2 questions:10:2 coauthor-physics:10:2"
      max_splits:
        description: "Limit splits per dataset (empty = all)"
        default: ""
      rescue_run:
        description: "Run id whose run-* artifacts are collected and pushed again (no experiment runs); for runs whose own push failed"
        default: ""
  pull_request:
    paths:
      - "scripts/run_e1.py"
      - "scripts/aggregate_e1.py"
      - "edsp/eval/**"
      - "edsp/baselines/**"
      - ".github/workflows/e1.yml"

permissions:
  contents: read

jobs:
  plan:
    if: inputs.rescue_run == ''
    runs-on: ubuntu-latest
    outputs:
      datasets: ${{ steps.p.outputs.datasets }}
      extra: ${{ steps.p.outputs.extra }}
      suite: ${{ steps.p.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          SUITE="${{ inputs.suite || 'E1' }}"
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'datasets=[{"dataset":"cora","range":"","tag":"cora"},{"dataset":"chameleon-filtered","range":"","tag":"chameleon-filtered"},{"dataset":"sampson","range":"","tag":"sampson"},{"dataset":"wiki-editor","range":"","tag":"wiki-editor"},{"dataset":"amazon-fraud","range":"0:1","tag":"amazon-fraud-00"}]' >> "$GITHUB_OUTPUT"
            echo 'extra=--max-splits 1 --h7-splits 1' >> "$GITHUB_OUTPUT"
          else
            if [ -n "${{ inputs.datasets }}" ]; then
              LIST=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "${{ inputs.datasets }}")
            elif [ "$SUITE" = C4 ]; then
              LIST='["ogbn-proteins"]'
            else
              LIST=$(python3 -c 'import json,sys; d=json.load(open("data/REGISTRY.json"))["datasets"]; e2=lambda v: v.get("cell") in ("C3a","C5"); print(json.dumps(sorted(k for k,v in d.items() if v.get("loader") and k!="ogbn-proteins" and not v.get("extension") and (e2(v) if sys.argv[1]=="E2" else not e2(v) or k=="sampson"))))' "$([ "$SUITE" = E2 ] && echo E2 || echo E1)")
            fi
            CH="${{ inputs.chunks }}"
            LIST=$(python3 -c '
          import json, sys
          names, chunks = json.loads(sys.argv[1]), {}
          for c in sys.argv[2].split():
              n, total, size, *start = c.split(":")
              chunks[n] = (int(total), int(size), int(start[0]) if start else 0)
          inc = []
          for n in names:
              if n in chunks:
                  total, size, first = chunks[n]
                  inc += [{"dataset": n, "range": f"{a}:{min(a + size, total)}", "tag": f"{n}-{a:02d}"} for a in range(first, total, size)]
              else:
                  inc.append({"dataset": n, "range": "", "tag": n})
          print(json.dumps(inc))' "$LIST" "$CH")
            echo "datasets=$LIST" >> "$GITHUB_OUTPUT"
            EX="${{ inputs.extra_args }}"
            if [ -n "${{ inputs.max_splits }}" ]; then EX="$EX --max-splits ${{ inputs.max_splits }}"; fi
            echo "extra=$EX" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: plan
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # leave free runners for the CI checks of open pull requests (20 concurrent jobs per account)
      max-parallel: 15
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.datasets) }}
    env:
      EDSP_DATA_DIR: ${{ github.workspace }}/.edsp-cache
      SUITE: ${{ needs.plan.outputs.suite }}
      EDSP_ACQUISITION_LOG: ${{ github.workspace }}/results/runs/acq/ACQUISITION_LOG-${{ matrix.tag }}.jsonl
    steps:
      - uses: actions/checkout@v4
      - name: Install uv from PyPI (GitHub release downloads returned HTTP 504 on 2026-11-08)
        run: |
          for i in 1 2 3 4 5; do python3 -m pip install --user --break-system-packages -q uv==0.13.7 && break; sleep 15; done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --group dev
      - name: Optional B5 dependencies (not in uv.lock; only for --signed-gnn runs)
        if: contains(needs.plan.outputs.extra, '--signed-gnn')
        run: uv pip install -r requirements/signed-gnn.txt
      - uses: actions/cache@v4
        with:
          path: .edsp-cache
          key: edsp-raw-${{ hashFiles('data/REGISTRY.json') }}
          restore-keys: edsp-raw-
      - run: |
          OUT=results/runs/$(echo "$SUITE" | tr '[:upper:]' '[:lower:]')
          # start from an empty output directory: committed records of earlier runs
          # must never be mixed with this run's records (rule R1)
          rm -rf "$OUT" results/runs/acq
          if [ "$SUITE" = C4 ]; then
            # per-task binary views; stop starting new tasks before the 330-minute job limit
            uv run python scripts/run_c4.py --suite "$SUITE" --out "$OUT" --datasets ${{ matrix.dataset }} --time-budget-min 290 \
              ${{ needs.plan.outputs.extra }} ${{ matrix.range && format('--tasks {0}', matrix.range) || '' }}
          else
          uv run python scripts/run_e1.py --suite "$SUITE" --out "$OUT" --datasets ${{ matrix.dataset }} ${{ needs.plan.outputs.extra }} \
            ${{ matrix.range && format('--split-range {0}', matrix.range) || '' }}
          fi
          mkdir -p "$OUT" && cp results/runs/acq/*.jsonl "$OUT"/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ matrix.tag }}
          path: results/runs/
          if-no-files-found: warn

  aggregate:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SUITE: ${{ needs.plan.outputs.suite || inputs.suite }}
      RESCUE: ${{ inputs.rescue_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv from PyPI (GitHub release downloads returned HTTP 504 on 2026-11-08)
        run: |
          for i in 1 2 3 4 5; do python3 -m pip install --user --break-system-packages -q uv==0.13.7 && break; sleep 15; done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --group dev
      - name: Drop committed records of earlier runs
        run: |
          S=$(echo "$SUITE" | tr '[:upper:]' '[:lower:]')
          rm -rf "results/runs/$S" "results/aggregates/$S"
      - uses: actions/download-artifact@v4
        if: inputs.rescue_run == ''
        with:
          pattern: runs-*
          path: results/runs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.rescue_run != ''
        with:
          pattern: runs-*
          path: results/runs
          merge-multiple: true
          run-id: ${{ inputs.rescue_run }}
          github-token: ${{ github.token }}
      - name: Aggregate (a failure here must not lose the records)
        run: |
          if [ "$SUITE" = C4 ]; then
            uv run python scripts/aggregate_c4.py --suite "$SUITE" || echo "::warning::aggregate_c4.py failed; records are pushed unaggregated"
          else
            uv run python scripts/aggregate_e1.py --suite "$SUITE" || echo "::warning::aggregate_e1.py failed for suite $SUITE; records are pushed unaggregated"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-${{ github.run_id }}
          path: |
            results/runs/
            results/aggregates/
      - name: Push results branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          S=$(echo "$SUITE" | tr '[:upper:]' '[:lower:]')
          # a re-run attempt or a rescue must not collide with a branch pushed earlier
          BR="results/$S-${RESCUE:-${{ github.run_id }}}"
          if [ -n "$RESCUE" ]; then BR="$BR-rescue-${{ github.run_id }}"; fi
          if [ "${{ github.run_attempt }}" != "1" ]; then BR="$BR-a${{ github.run_attempt }}"; fi
          git checkout -b "$BR"
          mkdir -p "results/aggregates/$S"
          git add -f "results/runs/$S" "results/aggregates/$S"
          git commit -m "$SUITE results from Actions run ${RESCUE:-${{ github.run_id }}} (attempt ${{ github.run_attempt }}; commit ${{ github.sha }})"
          git push origin "$BR"
